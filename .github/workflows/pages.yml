name: Deploy PlanetForge to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test tools
        run: npm install --no-audit --no-fund

      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/globe3d.js
          node --check assets/js/generator.js
          node --check assets/js/planet-worker.js
          node --check assets/js/export-worker.js
          node --check assets/js/history.js
          node --check assets/js/share.js

      - name: Run generator smoke and browser end-to-end tests
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare static Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp -R assets _site/assets
          touch _site/.nojekyll

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
